<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="icons/hordeshaper.svg" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="theme-color" content="#0c5460" />
<title>hordeshaper is a Horde Shaper</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <h1>Horde Shaper</h1>
  <button id="settingsBtn" aria-label="Settings">⚙️</button>
</header>

<main>
  <section class="card">
    <label for="presetSelect">Preset</label>
    <select id="presetSelect"></select>
  </section>

  <section class="card">
    <label for="subjectInput">Subject</label>
    <input id="subjectInput" list="subjectList" placeholder="e.g. grotesk cyborg" />
    <datalist id="subjectList"></datalist>
  </section>

  <section class="card">
  <label>Resolution</label>
  <div class="row">
    <select id="resPresetSelect">
      <option value="512x512">512 × 512 (fast icon)</option>
      <option value="512x768">512 × 768 (portrait)</option>
      <option value="768x512">768 × 512 (landscape)</option>
      <option value="768x768">768 × 768 (SD 1.5 max)</option>
      <option value="832x1216">832 × 1216 (SDXL portrait)</option>
      <option value="1024x1024">1024 × 1024 (SDXL square)</option>
      <option value="custom">custom…</option>
    </select>
  </div>
  <div class="row" id="customResRow" hidden>
    <input id="resWidth" type="number" min="64" max="2048" step="64" placeholder="width" />
    <input id="resHeight" type="number" min="64" max="2048" step="64" placeholder="height" />
  </div>
  <small class="hint" id="resHint"></small>
</section>

  <section class="card">
    <label for="seedInput">Seed <small>(blank = random)</small></label>
    <input id="seedInput" type="number" placeholder="random" />
  </section>

  <section class="card">
    <label>Prompt preview</label>
    <textarea id="promptPreview" readonly rows="6"></textarea>
    <label>Negative</label>
    <textarea id="negativePreview" readonly rows="3"></textarea>
    <div class="row">
      <button id="copyPromptBtn">Copy prompt</button>
      <button id="generateBtn" class="primary">Generate</button>
    </div>
  </section>

  <section class="card" id="resultCard" hidden>
    <label>Result</label>
    <img id="resultImg" alt="generated" />
    <div class="meta">
      <span>seed: <b id="resultSeed">–</b></span>
      <span>model: <b id="resultModel">–</b></span>
    </div>
    <div class="action-grid">
      <button id="rerunBtn">Rerun</button>
      <button id="saveRecipeBtn">Save recipe</button>
      <button id="downloadBtn">Save image</button>
      <button id="cancelBtn" class="danger" hidden>Cancel</button>
    </div>
    <p id="statusLine" class="status"></p>
  </section>
</main>

<dialog id="settingsDialog">
  <div>
    <h2>Settings</h2>

    <label for="apiKeyInput">Horde API key <small>(blank = anonymous)</small></label>
    <input id="apiKeyInput" placeholder="0000000000" />

    <label>Model</label>
    <div class="row">
      <select id="modelReliableSelect">
        <option value="">— reliable (from preset) —</option>
      </select>
      <select id="modelUnstableSelect">
        <option value="">— unstable / testing —</option>
      </select>
    </div>
    <div class="model-preview">
      <img id="modelAvatar" src="avatars/default.svg" alt="" />
      <span id="modelAvatarName">— preset default —</span>
    </div>
    <small class="hint">Unstable = not on your reliable list, or count = 0. Expect stalls.</small>

    <menu>
      <button id="saveSettingsBtn" type="button" class="primary">Save</button>
      <button type="button" id="closeSettingsBtn">Cancel</button>
    </menu>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
