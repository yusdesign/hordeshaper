name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install base deps
        run: npm install

      - name: Install Capacitor plugins
        run: |
          npm install @capacitor/share
          npm install @capacitor/filesystem
          npm install @capacitor/browser
          npm install @capacitor/status-bar
          npm install @capacitor/core

      - name: Install asset + SVG tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          npm install --no-save @capacitor/assets

      - name: Add Android platform (only if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Generate launcher icon PNGs from SVG
        run: |
          set -e
          mkdir -p resources
          rsvg-convert -w 1024 -h 1024 resources/icon.svg -o resources/icon.png
          ls -l resources/icon.png

      - name: Generate Android resources
        run: npx @capacitor/assets generate --android

      - name: Verify plugins registered
        run: |
          cat android/app/src/main/assets/capacitor.plugins.json || true

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

